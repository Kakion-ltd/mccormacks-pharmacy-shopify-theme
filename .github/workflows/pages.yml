# Publishes the theme preview to GitHub Pages.
#
# preview/ is written for a real store — absolute /collections/... links and
# assets at /shopify-theme/assets — which a project site served from /<repo>/
# cannot serve. setup/build_static_preview.py restructures it into real
# directories and prefixes the base path; see that file for the details.

name: Deploy preview to Pages

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'shopify-theme/assets/**'
      - 'setup/build_static_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build static preview
        # base_path is "/mccormacks-pharmacy-shopify-theme" for a project site,
        # and "" if this ever moves to a user/org site or a custom domain.
        run: python3 setup/build_static_preview.py --base "${{ steps.pages.outputs.base_path }}" --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
